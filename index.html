<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Buscar CEP</title>
</head>

<body>
    <div class="container">
        <h1>Consultar Endereço por CEP</h1>
        <form id="form">
            <label for="cepInput">Digite o CEP:</label>
            <input type="text" id="cepInput" placeholder="Digite o CEP" required maxlength="8">
            <button type="submit">Buscar</button>
        </form>
        <ul id="resultado">
            <li><strong>Logradouro:</strong> <span id="logradouro"></span></li>
            <li><strong>Bairro:</strong> <span id="bairro"></span></li>
            <li><strong>Cidade:</strong> <span id="cidade"></span></li>
            <li><strong>Estado:</strong> <span id="estado"></span></li>
        </ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
